contract:
  name: RawCanBatch
  version: "1.0.0"
  description: Bounded CAN batch template with parametric payload and frame capacity.

params:
  - name: max_payload_bytes
    type: u32
    min: 8
    max: 2048
    default: 64
  - name: batch_capacity
    type: u32
    min: 1
    max: 256
    default: 32

types:
  - name: Direction
    kind: enum
    underlying: u8
    values:
      - name: Rx
        value: 0
      - name: SelfRx
        value: 1

  - name: Kind
    kind: enum
    underlying: u8
    values:
      - name: Data
        value: 0
      - name: Remote
        value: 1
      - name: Error
        value: 2
      - name: Heartbeat
        value: 3

  - name: CanFrame
    kind: record
    fields:
      - name: hw_time_ns
        type: i64
      - name: can_id
        type: u32
      - name: direction
        type: Direction
      - name: kind
        type: Kind
      - name: raw_dlc
        type: u8
      - name: payload_length
        type: u8
      - name: payload
        type: u8[max_payload_bytes]

fields:
  - name: frames
    type: CanFrame[batch_capacity]
  - name: count
    type: u32
  - name: assigned_frame
    type: u32

concrete:
  - name: RawCanBatchClassical
    params:
      max_payload_bytes: 8
      batch_capacity: 16
  - name: RawCanBatchFd
    params:
      max_payload_bytes: 64
      batch_capacity: 32
  - name: RawCanBatchXl
    params:
      max_payload_bytes: 2048
      batch_capacity: 8
