name: CI

on:
  push:
    branches: [main, feature/*]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            build-dir: build
            cmake-args: ""
            needs-xvfb: true
          - name: debug
            build-dir: build-debug
            cmake-args: -DCMAKE_BUILD_TYPE=Debug
            needs-xvfb: true
          - name: release
            build-dir: build-release
            cmake-args: -DCMAKE_BUILD_TYPE=Release
            needs-xvfb: true
          - name: clang
            build-dir: build-clang
            cmake-args: -DCMAKE_C_COMPILER=clang-19 -DCMAKE_CXX_COMPILER=clang++-19
            needs-xvfb: true
          - name: asan
            build-dir: build-asan
            cmake-args: >-
              -DCMAKE_CXX_FLAGS=-fsanitize=address
              -DCMAKE_C_FLAGS=-fsanitize=address
              -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address
              -DCMAKE_SHARED_LINKER_FLAGS=-fsanitize=address
            needs-xvfb: false
          - name: tsan
            build-dir: build-tsan
            cmake-args: >-
              -DCMAKE_CXX_FLAGS=-fsanitize=thread
              -DCMAKE_C_FLAGS=-fsanitize=thread
              -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=thread
              -DCMAKE_SHARED_LINKER_FLAGS=-fsanitize=thread
            needs-xvfb: false
          - name: ubsan
            build-dir: build-ubsan
            cmake-args: >-
              -DCMAKE_CXX_FLAGS=-fsanitize=undefined
              -DCMAKE_C_FLAGS=-fsanitize=undefined
              -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=undefined
              -DCMAKE_SHARED_LINKER_FLAGS=-fsanitize=undefined
            needs-xvfb: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone nexigen-cpp sibling dependency
        run: |
          mkdir -p ../nexigen-ecosystem
          git clone --depth 1 --branch learning-enhancement https://github.com/nexigen-tech/nexigen-cpp.git ../nexigen-ecosystem/nexigen-cpp

      - name: Patch missing nexigen-cpp cmake config template
        run: |
          # TODO: remove this step once nexigen-cpp commits cmake/nexigenConfig.cmake.in
          # instead of ignoring *.cmake.in in its .gitignore.
          python3 - <<'PY'
          from pathlib import Path
          Path("../nexigen-ecosystem/nexigen-cpp/cmake/nexigenConfig.cmake.in").write_text(
              "@PACKAGE_INIT@\n"
              "\n"
              "# nexigen-cpp package configuration.\n"
              "include(CMakeFindDependencyMacro)\n"
              "find_dependency(Threads)\n"
              "find_dependency(nlohmann_json)\n"
              "include(\"${CMAKE_CURRENT_LIST_DIR}/nexigenTargets.cmake\")\n"
              "set_property(TARGET nexigen::core APPEND PROPERTY\n"
              "    INTERFACE_LINK_LIBRARIES nlohmann_json::nlohmann_json)\n"
              "check_required_components(nexigen)\n"
          )
          PY

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            g++ \
            clang-19 \
            libstdc++-13-dev \
            xvfb \
            libgl1-mesa-dev
          sudo mkdir -p /tmp/opencode

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cbindgen
        run: cargo install cbindgen

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # CMake dependency cache disabled while diagnosing configure failures.
      # - name: Cache CMake dependencies
      #   uses: actions/cache@v4
      #   with:
      #     path: |
      #       ${{ matrix.build-dir }}/_deps
      #     key: ${{ runner.os }}-${{ matrix.name }}-deps-v2-${{ hashFiles('CMakeLists.txt') }}
      #     restore-keys: |
      #       ${{ runner.os }}-${{ matrix.name }}-deps-v2-

      - name: Configure
        run: |
          python3 - <<'PY'
          import subprocess, sys, os
          args = ["cmake", "-S", ".", "-B", "${{ matrix.build-dir }}"]
          cmake_args = "${{ matrix.cmake-args }}".strip()
          if cmake_args:
              args.extend(cmake_args.split())
          result = subprocess.run(args, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
          with open("configure.log", "w") as f:
              f.write(result.stdout)
          if result.returncode != 0:
              print("=== configure.log (last 100 lines) ===")
              lines = result.stdout.splitlines()
              print("\n".join(lines[-100:]))
              build_dir = "${{ matrix.build-dir }}"
              for log_name in ["CMakeFiles/CMakeOutput.log", "CMakeFiles/CMakeError.log"]:
                  path = os.path.join(build_dir, log_name)
                  print(f"=== {log_name} ===")
                  if os.path.exists(path):
                      with open(path) as f:
                          print(f.read())
                  else:
                      print("(not found)")
          sys.exit(result.returncode)
          PY

      - name: Build
        run: cmake --build ${{ matrix.build-dir }} -j$(nproc)

      - name: Test
        run: |
          if [ "${{ matrix.needs-xvfb }}" = "true" ]; then
            xvfb-run ctest --test-dir ${{ matrix.build-dir }} --output-on-failure -j$(nproc)
          else
            ctest --test-dir ${{ matrix.build-dir }} --output-on-failure -j$(nproc)
          fi

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.name }}
          path: |
            ${{ matrix.build-dir }}/Testing/Temporary/LastTest.log
            ${{ matrix.build-dir }}/Testing/Temporary/LastTestsFailed.log
            ${{ matrix.build-dir }}/CMakeFiles/CMakeOutput.log
            ${{ matrix.build-dir }}/CMakeFiles/CMakeError.log
          if-no-files-found: ignore
