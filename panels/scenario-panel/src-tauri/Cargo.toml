[package]
name = "scenario-panel"
version = "0.1.0"
description = "Tauri + Svelte scenario panel for Nexigen Synthetic Dome"
edition = "2021"
rust-version = "1.93.1"

[lib]
name = "scenario_panel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "scenario-panel"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
