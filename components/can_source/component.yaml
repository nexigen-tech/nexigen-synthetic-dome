component:
  name: CanSource
  version: "1.0.0"
  description: Deterministic CAN source — generates RawCanBatchClassical frames each tick.

sdk:
  abi_major: 1
  abi_minor: 1

contracts:
  - name: RawCanBatchClassical
    version: "1.0.0"

ports:
  - name: out
    direction: out
    contract: RawCanBatchClassical
    contract_version: "1.0.0"
    semantics: signal
    required: true

parameters:
  - name: source_name
    type: u8[8]
    default: "CAN_SRC"
    description: ASCII source name used to tag outgoing batches.
    required: false

thread_roles:
  - name: main
    required: true
    single_cpu: true
    default_schedule: fifo

resources:
  max_heap_bytes: 0
  deterministic: true
  uses_rng: false
  requires_hardware_rt: false

supported_modes:
  - headless