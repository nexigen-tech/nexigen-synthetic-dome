contract:
  name: CanAggregateErrors
  version: "1.0.0"
  description: Aggregate CAN reception error counters and activity interval [D, H).

types:
  - name: Status
    kind: enum
    underlying: u8
    values:
      - name: Valid
        value: 0
      - name: Degraded
        value: 1
      - name: Invalid
        value: 2

fields:
  - name: detection_time_ns
    type: i64
    description: Start of the observed interval (D) in hardware nanoseconds.
  - name: heartbeat_time_ns
    type: i64
    description: End of the observed interval (H) in hardware nanoseconds.
  - name: rx_valid
    type: u32
    description: Count of valid frames received.
  - name: rx_degraded
    type: u32
    description: Count of degraded frames received.
  - name: rx_invalid
    type: u32
    description: Count of invalid frames received.
  - name: crc_errors
    type: u32
    description: Count of frames with CRC errors preserved for diagnostics.
  - name: self_rx_count
    type: u32
    description: Count of SelfRx loopback frames.
  - name: activity_filter
    type: u32
    description: Activity bitmask used for filtering.
  - name: status
    type: Status
    description: Aggregate status.
