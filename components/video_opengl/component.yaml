component:
  name: VideoOpengl
  version: "1.0.0"
  description: Qt/OpenGL video receiver that subscribes to a logical video source and exposes reception counters.

sdk:
  abi_major: 1
  abi_minor: 1

contracts:
  - name: VideoFrame
    version: "1.0.0"
  - name: VideoHeartbeat
    version: "1.0.0"
  - name: VideoAggregateErrors
    version: "1.0.0"

ports:
  - name: in
    direction: in
    contract: VideoFrame
    contract_version: "1.0.0"
    semantics: signal
    required: true
  - name: aggregate
    direction: out
    contract: VideoAggregateErrors
    contract_version: "1.0.0"
    semantics: signal
    required: true

parameters:
  - name: source_name
    type: u8[8]
    default: "Camera_Front_Left"
    description: ASCII source name this receiver subscribes to; padded or truncated to 8 bytes.
    required: false
  - name: silence_interval_ns
    type: u64
    default: 40000000
    description: Silence interval in nanoseconds before the receiver reports no signal.
    required: false

thread_roles:
  - name: main
    required: true
    single_cpu: true
    default_schedule: fifo

resources:
  max_heap_bytes: 0
  deterministic: true
  uses_rng: false
  requires_hardware_rt: false

supported_modes:
  - headless