language = "C"
cpp_compat = true
header = """
#include <stdint.h>

/* ABI-1 target fingerprint: "NXD_ABI_1_le64_x86_v01" padded with NULs. */
static const uint8_t NXD_ABI_1_TARGET[32] = {
    0x4e, 0x58, 0x44, 0x5f, 0x41, 0x42, 0x49, 0x5f,
    0x31, 0x5f, 0x6c, 0x65, 0x36, 0x34, 0x5f, 0x78,
    0x38, 0x36, 0x5f, 0x76, 0x30, 0x31, 0x00, 0x00,
    0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00
};
"""
include_guard = "NXD_ABI_H"
style = "type"
tab_width = 4

[parse]
parse_deps = false

[export]
include = ["NxdAbiVersion", "NxdAbiFingerprint", "NxdFrameContext", "NxdTelemetryHandle", "NxdComponentState", "NxdAbiTable", "NxdCreateFn", "NxdDestroyFn", "NxdInitializeFn", "NxdArmFn", "NxdStepFn", "NxdStopFn", "NxdAbiEntryFn"]
exclude = ["ZERO", "ABI_1_TARGET", "ABI_1_SIZE"]
